<body>
  <canvas id="game"></canvas>
  <canvas id="hud"></canvas>
  <div id="overlay" class="overlay">
    <div id="panel" class="panel"></div>
  </div>
  <script type="module" src="game.js?v=22"></script>
  <script>
    // Service worker: caches the whole game so it opens instantly next time and
    // keeps working with no connection. Registration is silent — if the browser
    // refuses (private mode, http, old webview) the game runs exactly as before.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
</body>
